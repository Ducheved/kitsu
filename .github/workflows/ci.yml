# Every push to any branch and every pull request: the checks, then (once
# they pass) installers and CLI archives for Windows, Linux and macOS as
# workflow artifacts. Releases are release.yml's job. See docs/releasing.md.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push supersedes a branch build; every commit on main keeps its run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    # A branch in this repository is already built by its push; build pull
    # requests only when they come from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/build.yml
    with:
      retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}
    # No secrets: dev builds are never signed, and never see signing keys.
