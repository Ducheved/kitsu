# Every push to any branch and every pull request: the checks, then (once
# they pass) installers and CLI archives for Windows, Linux and macOS as
# workflow artifacts. Releases are release.yml's job. See docs/releasing.md.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push supersedes a branch build; every commit on main keeps its run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    # A branch in this repository is already built by its push; build pull
    # requests only when they come from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/build.yml
    with:
      retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}
    # No secrets: dev builds are never signed, and never see signing keys.

  # The CLI's tests on the other platforms. Kitsu has only been run on Linux
  # so far, so this job reports what breaks there without holding back the
  # installers; make it required once it has been green for a while.
  cli-tests:
    name: cli tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p kitsu --locked --no-fail-fast
