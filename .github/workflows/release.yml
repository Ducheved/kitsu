# Releases, driven by release-please (release-please-config.json):
#
# 1. Every push to main updates the release PR: the next version computed
#    from Conventional Commits, CHANGELOG.md, and the version in every file
#    that states it. Cargo.lock is then updated by cargo, on that branch.
# 2. Merging the release PR makes release-please tag vX.Y.Z and publish the
#    GitHub Release; this run then checks and builds that tag and attaches
#    the installers, CLI archives and SHA256SUMS to the release.
#
# workflow_dispatch rebuilds an existing tag and re-uploads its assets.
# See docs/releasing.md.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and attach assets to, e.g. v0.2.0
        required: true
        type: string

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT or GitHub App token makes CI run on the release PR; with
          # the default token GitHub starts no workflows for it.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps the Cargo.toml versions; the lockfile entries for
  # the workspace's own packages are cargo's to write.
  lockfile:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-please-lockfile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - name: Rust toolchain
        run: rustup toolchain install
      - name: cargo update --workspace
        run: |
          cargo update --workspace
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Cargo.lock for the release" -- Cargo.lock
          git push

  target:
    needs: release-please
    if: always() && (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          CREATED: ${{ needs.release-please.outputs.release_created }}
          CREATED_TAG: ${{ needs.release-please.outputs.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag=$INPUT_TAG
          elif [[ "$CREATED" == "true" ]]; then
            tag=$CREATED_TAG
          else
            echo "No release this time."
            exit 0
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a release tag (vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "Releasing $tag"

  checks:
    needs: target
    if: always() && needs.target.outputs.tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      ref: refs/tags/${{ needs.target.outputs.tag }}

  build:
    needs: [target, checks]
    if: always() && needs.target.outputs.tag != '' && needs.checks.result == 'success'
    permissions:
      contents: read
    # Never cancelled; one build per tag at a time.
    concurrency:
      group: release-build-${{ needs.target.outputs.tag }}
      cancel-in-progress: false
    uses: ./.github/workflows/build.yml
    with:
      ref: refs/tags/${{ needs.target.outputs.tag }}
      release: true
      retention-days: 7
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

  publish:
    needs: [target, build]
    if: always() && needs.target.outputs.tag != '' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ needs.target.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kitsu-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
