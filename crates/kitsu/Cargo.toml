[package]
name = "kitsu"
version = "0.1.0"
description = "Engineering state for humans and coding agents: tasks, checks, evidence, isolated runs."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kitsu"
path = "src/main.rs"

# A deterministic ACP agent. Used by the test suite and by `kitsu demo`
# so the whole loop can be exercised without an API key.
[[bin]]
name = "kitsu-test-agent"
path = "src/bin/test_agent.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"

[lints]
workspace = true
