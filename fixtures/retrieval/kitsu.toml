# Questions about this repository with the files that answer them.
# Run: cargo run --release --example retrieval
#
# Most are phrased the way an agent asks when it doesn't know the names
# yet; a few use identifiers. A hit is any expected path in the top k.
# `kind` is "words" (natural language) or "name" (knows an identifier).

[[q]]
kind = "words"
query = "how does a run stop when the user asks it to"
expect = ["crates/kitsu/src/runner.rs"]

[[q]]
kind = "words"
query = "what happens when two processes try to own the same run"
expect = ["crates/kitsu/src/workspace.rs"]

[[q]]
kind = "words"
query = "accepting a change squash merge and verify on the combined tree"
expect = ["crates/kitsu/src/integrate.rs"]

[[q]]
